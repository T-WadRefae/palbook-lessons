/* ============================================================
   AUDIO — simple Web Audio API sounds
   ============================================================ */
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type = 'sine', vol = 0.15) {
  const ctx = getAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, ctx.currentTime + start);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime + start); osc.stop(ctx.currentTime + start + dur);
}
const SFX = {

  wrong()   { tone(220, 0, 0.18, 'sawtooth', 0.12); tone(165, 0.15, 0.25, 'sawtooth', 0.12); },
  chest()   { tone(880, 0, 0.1); tone(1175, 0.09, 0.1); tone(1568, 0.18, 0.22); },
  win()     { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.14, 0.2, 'triangle', 0.18)); },

    foundChests: new Set(),
    usedQuestionWords: new Set(),
    usedChestWords: new Set(),
    pendingGate: null,
    answered: false,
  };
}

/* ============================================================
   QUESTION GENERATION (multiple choice, 4 options)
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickWord(pool, usedSet) {
  const fresh = pool.filter(w => !usedSet.has(w.en));
  const word = (fresh.length ? fresh : pool)[Math.floor(Math.random() * (fresh.length ? fresh.length : pool.length))];
  if (!fresh.length) usedSet.clear();
  usedSet.add(word.en);
  return word;
}
function buildQuestion(worldKey, usedSet) {
  const pool = VOCAB[worldKey];
  const word = pickWord(pool, usedSet);
  const types = ['meaning', 'reverse'];
  if (word.syn.length) types.push('syn');
  if (word.ant.length) types.push('ant');
  const type = types[Math.floor(Math.random() * types.length)];

  let text, answer, distractorField;
  if (type === 'meaning') {
    text = t('qMeaning')(word.en); answer = word.ar; distractorField = w => w.ar;
  } else if (type === 'reverse') {
    text = t('qReverse')(word.ar); answer = word.en; distractorField = w => w.en;
  } else if (type === 'syn') {
    text = t('qSyn')(word.en); answer = word.syn[0];
    distractorField = w => (w.syn[0] || w.en);
  } else {
    text = t('qAnt')(word.en); answer = word.ant[0];
    distractorField = w => (w.ant[0] || w.en);
  }
  const distractors = [];
  for (const w of shuffle(pool)) {
    const d = distractorField(w);
    if (d && d !== answer && d !== word.en && !distractors.includes(d)) distractors.push(d);
    if (distractors.length === 3) break;
  }
  return { text, answer, options: shuffle([answer, ...distractors]) };
}

/* ============================================================
   DOM HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
let toastTimer = null;
function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, -8px)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%, 0)';
  }, 1800);
}
function anyModalOpen() {
  return ['modal-question', 'modal-chest', 'modal-victory'].some(id => !$(id).classList.contains('hidden'));
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderHome() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('btn-lang').textContent = t('langBtn');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (typeof v === 'string') el.textContent = v;
  });
  const cards = $('world-cards');
  cards.innerHTML = '';
  for (const key of Object.keys(WORLDS)) {
    const w = WORLDS[key];
    const btn = document.createElement('button');
    btn.className = 'group bg-white/5 hover:bg-white/15 border border-white/15 hover:border-amber-400/60 rounded-2xl p-6 text-center transition shadow-lg';
    btn.innerHTML = `
      <div class="text-5xl mb-3 group-hover:scale-110 transition">${w.icon}</div>
      <div class="font-black text-lg mb-1">${t('worldNames')[key]}</div>
      <div class="text-xs text-slate-400">${t('worldDesc')[key]}</div>`;
    btn.addEventListener('click', () => startWorld(key));
    cards.appendChild(btn);
  }
  const how = $('how-list');
  how.innerHTML = '';
  for (const line of t('how')) {
    const li = document.createElement('li');
    li.textContent = line;
    how.appendChild(li);
  }
}

function renderHUD() {
  $('hud-score').textContent = state.score;
  $('hud-gates').textContent = `${state.openedGates.size}/${TOTAL_GATES}`;
  $('hud-chests').textContent = `${state.foundChests.size}/3`;
  $('hud-hint').textContent = state.openedGates.size === TOTAL_GATES
    ? t('goExitHint')
    : t('nextGateHint')(state.nextGate);
}

function renderMaze(bounce = false) {
  const world = WORLDS[state.worldKey];
  const maze = $('maze');
  maze.innerHTML = '';
  // visual order is always left-to-right regardless of page direction
  maze.dir = 'ltr';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const ch = state.map[r][c];
      const cell = document.createElement('div');
      cell.className = `cell rounded-md ${ch === '#' ? world.wallBg : world.floorBg}`;
      const isPlayer = state.player.r === r && state.player.c === c;
      if (ch === '#') {
        cell.textContent = world.wall;
      } else if (ch === 'E') {
        cell.textContent = world.exitIcon;
        if (state.openedGates.size === TOTAL_GATES) cell.classList.add('sparkle', 'bg-emerald-500/40');
      } else if (/[1-5]/.test(ch)) {
        if (state.openedGates.has(ch)) {
          cell.textContent = '🟩';
          cell.classList.add('opacity-70');
        } else {
          cell.textContent = '🚪';
          const badge = document.createElement('span');
          badge.className = 'gate-badge';
          badge.textContent = ch;
          cell.appendChild(badge);
          if (Number(ch) === state.nextGate) cell.classList.add('ring-2', 'ring-amber-400');
        }
      }
      // hidden chests look like normal floor until found — intentionally no icon
      if (isPlayer) {
        const p = document.createElement('span');
        p.textContent = '🧒';
        p.className = 'absolute inset-0 flex items-center justify-center' + (bounce ? ' player-bounce' : '');
        cell.appendChild(p);
      }
      maze.appendChild(cell);
    }
  }
  renderHUD();
}

/* ============================================================
   MOVEMENT & GAME LOGIC
   ============================================================ */
function startWorld(worldKey) {
  state = newRun(worldKey);
  $('screen-home').classList.add('hidden');
  $('screen-game').classList.remove('hidden');
  $('world-title').textContent = `${WORLDS[worldKey].icon} ${t('worldNames')[worldKey]}`;
  renderMaze();
}

function goHome() {
  state = null;
  ['modal-question', 'modal-chest', 'modal-victory'].forEach(id => $(id).classList.add('hidden'));
  $('screen-game').classList.add('hidden');
  $('screen-home').classList.remove('hidden');
  renderHome();
}

function tryMove(dr, dc) {
  if (!state || anyModalOpen()) return;
  const r = state.player.r + dr, c = state.player.c + dc;
  if (r < 0 || r > 7 || c < 0 || c > 7) return;
  const ch = state.map[r][c];

  if (ch === '#') { SFX.blocked(); return; }

  if (/[1-5]/.test(ch) && !state.openedGates.has(ch)) {
    if (Number(ch) === state.nextGate) {
      openQuestionModal(ch, { r, c });
    } else {
      SFX.blocked();
      showToast(t('lockedGate')(state.nextGate));
    }
    return;
  }

  if (ch === 'E' && state.openedGates.size < TOTAL_GATES) {
    SFX.blocked();
    showToast(t('lockedExit'));
    return;
  }

  state.player = { r, c };
  SFX.move();
  renderMaze(true);

  if (ch === 'C' && !state.foundChests.has(`${r},${c}`)) {
    state.foundChests.add(`${r},${c}`);
    state.score += 15;
    openChestModal();
  } else if (ch === 'E') {
    showVictory();
  }
}

/* ---------- question modal ---------- */
function openQuestionModal(gateCh, gatePos) {
  state.pendingGate = { ch: gateCh, pos: gatePos };
  state.answered = false;
  const q = buildQuestion(state.worldKey, state.usedQuestionWords);
  $('q-gate-label').textContent = t('gateLabel')(gateCh);
  $('q-text').textContent = q.text;
  $('q-feedback').classList.add('hidden');
  $('q-continue').classList.add('hidden');
  const box = $('q-options');
  box.innerHTML = '';
  for (const opt of q.options) {
    const b = document.createElement('button');
    b.className = 'bg-white/10 hover:bg-amber-500/30 border border-white/20 rounded-xl py-3 px-4 font-bold text-start transition';
    b.textContent = opt;
    b.addEventListener('click', () => answerQuestion(b, opt, q));
    box.appendChild(b);
  }
  $('modal-question').classList.remove('hidden');
}

function answerQuestion(btn, chosen, q) {
  if (state.answered) return;
  state.answered = true;
  const fb = $('q-feedback');
  const ok = chosen === q.answer;
  // lock all option buttons and highlight the correct one
  $('q-options').querySelectorAll('button').forEach(b => {
    b.disabled = true;
    b.classList.remove('hover:bg-amber-500/30');
    if (b.textContent === q.answer) b.classList.add('bg-emerald-500/40', 'border-emerald-400');
  });
  if (ok) {
    SFX.correct();
    state.correct++;
    state.score += 10;
    state.openedGates.add(state.pendingGate.ch);
    state.nextGate++;
    fb.className = 'mt-4 text-center font-bold rounded-xl py-3 px-3 bg-emerald-500/20 text-emerald-300';
    fb.textContent = t('correctFb');
  } else {
    SFX.wrong();
    state.wrong++;
    state.score = Math.max(0, state.score - 2);
    btn.classList.add('bg-red-500/40', 'border-red-400', 'shake');
    fb.className = 'mt-4 text-center font-bold rounded-xl py-3 px-3 bg-red-500/20 text-red-300';
    fb.textContent = t('wrongFb')(q.answer);
  }
  fb.classList.remove('hidden');
  $('q-continue').classList.remove('hidden');
  $('q-continue').onclick = () => {
    $('modal-question').classList.add('hidden');
    if (ok && state.pendingGate) state.player = { ...state.pendingGate.pos };
    state.pendingGate = null;
    renderMaze(true);
  };
}

/* ---------- chest modal (enrichment card) ---------- */
function openChestModal() {
  SFX.chest();
  const word = pickWord(VOCAB[state.worldKey], state.usedChestWords);
  const rows = [
    `<div class="text-amber-300 font-black mb-1">${t('enrichTitle')}</div>`,
    `<div><span class="text-slate-400">${t('word')}:</span> <b class="text-lg">${word.en}</b></div>`,
    `<div><span class="text-slate-400">${t('meaning')}:</span> <b>${word.ar}</b></div>`,
  ];
  if (word.syn.length) rows.push(`<div><span class="text-slate-400">${t('synonym')}:</span> <b class="text-emerald-300">${word.syn.join(', ')}</b></div>`);
  if (word.ant.length) rows.push(`<div><span class="text-slate-400">${t('antonym')}:</span> <b class="text-rose-300">${word.ant.join(', ')}</b></div>`);
  $('chest-card').innerHTML = rows.join('');
  $('modal-chest').classList.remove('hidden');
}

/* ---------- victory ---------- */
function showVictory() {
  SFX.win();
  const total = state.correct + state.wrong;
  const acc = total ? state.correct / total : 1;
  const stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
  $('victory-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  $('v-score').textContent = state.score;
  $('v-correct').textContent = state.correct;
  $('v-chests').textContent = `${state.foundChests.size}/3`;
  $('modal-victory').classList.remove('hidden');
}

/* ============================================================
   INPUT — keyboard, on-screen buttons, touch swipe
   ============================================================ */
const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  };
  const dir = map[e.key];
  if (dir && state) {
    e.preventDefault();
    tryMove(...DIRS[dir]);
  }
});

document.querySelectorAll('.dpad').forEach(btn => {
  btn.addEventListener('click', () => tryMove(...DIRS[btn.dataset.dir]));
});

(function setupSwipe() {
  const maze = $('maze');
  let sx = 0, sy = 0, active = false;
  maze.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true;
  }, { passive: true });
  maze.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  maze.addEventListener('touchend', e => {
    if (!active) return;
    active = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) tryMove(...DIRS[dx > 0 ? 'right' : 'left']);
    else tryMove(...DIRS[dy > 0 ? 'down' : 'up']);
  }, { passive: true });
})();

/* ============================================================
   WIRING
   ============================================================ */
$('btn-lang').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  renderHome();
});
$('btn-home').addEventListener('click', goHome);
$('btn-restart').addEventListener('click', () => { if (state) startWorld(state.worldKey); });
$('chest-close').addEventListener('click', () => {
  $('modal-chest').classList.add('hidden');
  renderMaze();
});
$('v-replay').addEventListener('click', () => {
  $('modal-victory').classList.add('hidden');
  startWorld(state.worldKey);
});
$('v-home').addEventListener('click', goHome);

// unlock audio on first interaction (mobile autoplay policies)
document.addEventListener('pointerdown', getAudio, { once: true });

renderHome();
</script>
